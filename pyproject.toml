[project]
name = "ai-data-analyst"
version = "0.1.0"
description = "Agentic text-to-SQL analyst: the LLM investigates a database through validated SQL."
requires-python = ">=3.12"

# Dependencies are declared when the phase that imports them lands.
# Roadmap (see DECISIONS.md, D-05): sqlalchemy + psycopg[binary] -> phase 7.
dependencies = [
    "python-dotenv>=1.0,<2",
    "sqlglot>=25,<30",
    "openai>=1.40,<4",
    "psycopg[binary]>=3.1,<4",
    "fastapi>=0.115,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "httpx>=0.27,<1",
]
server = [
    "uvicorn>=0.30,<1",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "core*", "agents*", "tools*", "db*", "llm*", "evals*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
